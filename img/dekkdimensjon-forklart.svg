<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400" role="img" aria-labelledby="t d">
<title id="t">Dekkdimensjon 205/55 R16 forklart</title>
<desc id="d">Tverrsnitt av et dekk på felg. 205 er dekkbredden i millimeter, 55 er flankehøyden i prosent av bredden, R betyr radialdekk og 16 er felgdiameteren i tommer.</desc>
<rect width="520" height="400" fill="#ffffff"/>
<g transform="translate(190,190)">
  <circle r="150" fill="#1f2937"/>
  <circle r="118" fill="#e5e7eb"/>
  <circle r="112" fill="#9ca3af"/>
  <circle r="30" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <g stroke="#6b7280" stroke-width="6" stroke-linecap="round">
    <line x1="0" y1="-25" x2="0" y2="-100"/><line x1="0" y1="25" x2="0" y2="100"/>
    <line x1="-25" y1="0" x2="-100" y2="0"/><line x1="25" y1="0" x2="100" y2="0"/>
  </g>
</g>
<g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13" fill="#111827">
  <g stroke="#2563eb" stroke-width="2" fill="none">
    <path d="M355 40 L355 190" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M355 190 L355 308" marker-start="url(#a)" marker-end="url(#a)"/>
  </g>
  <line x1="190" y1="40" x2="365" y2="40" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="190" y1="308" x2="365" y2="308" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="190" y1="190" x2="365" y2="190" stroke="#cbd5e1" stroke-width="1"/>
  <text x="372" y="112" fill="#2563eb" font-weight="600">Flankehøyde</text>
  <text x="372" y="129" fill="#4b5563" font-size="12">55 % av 205 = 112,75 mm</text>
  <text x="372" y="246" fill="#2563eb" font-weight="600">Felgdiameter</text>
  <text x="372" y="263" fill="#4b5563" font-size="12">16″ = 406,4 mm</text>
  <g stroke="#b45309" stroke-width="2" fill="none">
    <path d="M40 350 L340 350" marker-start="url(#b)" marker-end="url(#b)"/>
  </g>
  <line x1="40" y1="316" x2="40" y2="358" stroke="#cbd5e1"/>
  <line x1="340" y1="316" x2="340" y2="358" stroke="#cbd5e1"/>
  <text x="190" y="376" text-anchor="middle" fill="#b45309" font-weight="600">Dekkbredde 205 mm</text>
  <text x="20" y="26" font-size="19" font-weight="700" fill="#111827">205/55 R16</text>
  <text x="150" y="26" font-size="12" fill="#6b7280">bredde / profil · radial · felg</text>
</g>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M4 0 L4 8 M1 3 L4 0 L7 3" stroke="#2563eb" stroke-width="1.6" fill="none"/></marker>
<marker id="b" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 4 L8 4 M3 1 L0 4 L3 7" stroke="#b45309" stroke-width="1.6" fill="none"/></marker></defs>
</svg>
